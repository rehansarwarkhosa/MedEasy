services:
  - type: web
    name: medeasy
    runtime: node
    buildCommand: npm install && cd client && npm install && npx vite build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: medeasy-data
      mountPath: /opt/render/data
      sizeGB: 1
